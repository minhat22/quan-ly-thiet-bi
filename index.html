<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearFlow Blue | Quản lý mượn thiết bị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">

</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">G</div><div><strong>GearFlow</strong><small>EQUIPMENT MANAGER</small></div></div>
  <div class="nav-label">TỔNG QUAN</div>
  <nav class="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span><span class="nav-text">Dashboard</span></button>
  </nav>
  <div class="nav-label">QUẢN LÝ</div>
  <nav class="nav">
    <button data-page="devices"><span class="ico">▣</span><span class="nav-text">Thiết bị</span></button>
    <button data-page="borrowers"><span class="ico">♙</span><span class="nav-text">Người mượn</span></button>
    <button data-page="loans"><span class="ico">⇄</span><span class="nav-text">Phiếu mượn</span></button>
    <button data-page="returns"><span class="ico">↩</span><span class="nav-text">Theo dõi trả</span></button>
  </nav>
  <div class="sidebar-bottom"><div class="online"><span class="dot"></span> Hệ thống hoạt động</div><p>GearFlow · Bản demo giao diện<br>Quản lý thiết bị tập trung</p></div>
</aside>
<main class="main">
  <div class="topbar"><div class="crumb">Workspace <span style="color:#53677d">/</span> <b id="crumb">Dashboard</b></div><div class="top-right"><div class="date-chip" id="today"></div><div class="user-chip"><div class="avatar">AD</div><span>Quản trị viên</span>⌄</div></div></div>
  <section id="page"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h3 id="modalTitle">Thêm mới</h3><button class="close" onclick="closeModal()">×</button></div><form id="modalForm"><div id="modalFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" type="submit">Lưu thông tin</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const seed = {
 devices:[
  {id:1,name:'Laptop Dell Latitude',type:'Máy tính',status:'Đang cho mượn',qty:12,icon:'💻'},
  {id:2,name:'Máy chiếu Epson',type:'Thiết bị trình chiếu',status:'Sẵn sàng',qty:6,icon:'📽️'},
  {id:3,name:'Bộ Arduino Uno',type:'Thiết bị thực hành',status:'Sẵn sàng',qty:20,icon:'🔌'},
  {id:4,name:'Camera Canon',type:'Thiết bị ghi hình',status:'Bảo trì',qty:4,icon:'📷'},
  {id:5,name:'Máy đo điện đa năng',type:'Dụng cụ đo',status:'Sẵn sàng',qty:10,icon:'🔧'}
 ],
 borrowers:[
  {id:1,name:'Nguyễn Minh Anh',unit:'Khoa Công nghệ thông tin',phone:'0901 234 567'},
  {id:2,name:'Trần Hoàng Nam',unit:'Phòng thí nghiệm A',phone:'0912 345 678'},
  {id:3,name:'Lê Thảo Vy',unit:'Khoa Điện - Điện tử',phone:'0987 654 321'}
 ],
 loans:[
  {id:1001,borrower:'Nguyễn Minh Anh',device:'Laptop Dell Latitude',qty:2,borrowDate:'2026-10-27',dueDate:'2026-11-02',returnDate:'',status:'Đang mượn'},
  {id:1002,borrower:'Trần Hoàng Nam',device:'Máy chiếu Epson',qty:1,borrowDate:'2026-10-25',dueDate:'2026-10-29',returnDate:'',status:'Quá hạn'},
  {id:1003,borrower:'Lê Thảo Vy',device:'Bộ Arduino Uno',qty:3,borrowDate:'2026-10-20',dueDate:'2026-10-26',returnDate:'2026-10-26',status:'Đã trả'}
 ]
};
let data = JSON.parse(localStorage.getItem('gearflow_demo')||'null') || seed;
let currentPage='dashboard', editing=null, modalType='';
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem('gearflow_demo',JSON.stringify(data));
const money=n=>new Intl.NumberFormat('vi-VN').format(n);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function statusClass(s){return s==='Sẵn sàng'||s==='Đã trả'?'green':s==='Quá hạn'||s==='Bảo trì'?'red':s==='Đang mượn'||s==='Đang cho mượn'?'blue':'yellow'}
function head(kicker,title,desc,button=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}
function stat(label,value,icon,note,color='var(--green)'){return `<div class="stat" style="--glow:${color}"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><small>${note}</small></div>`}
function dashboard(){
 const total=data.devices.reduce((s,d)=>s+Number(d.qty),0), active=data.loans.filter(x=>x.status==='Đang mượn').length, overdue=data.loans.filter(x=>x.status==='Quá hạn').length, ready=data.devices.filter(x=>x.status==='Sẵn sàng').length;
 return head('OVERVIEW / 01','Tổng quan hệ thống','Theo dõi nhanh tình hình thiết bị và hoạt động mượn – trả.','<button class="btn btn-primary" onclick="openModal(\'loan\')">＋ Tạo phiếu mượn</button>')+
 `<div class="stats">${stat('Tổng số thiết bị',total,'▣','Trong kho và đang lưu hành')}${stat('Phiếu đang mượn',active,'⇄','Cần theo dõi lịch trả', 'var(--blue)')}${stat('Thiết bị sẵn sàng',ready,'✓','Có thể đăng ký mượn')}${stat('Phiếu quá hạn',overdue,'◷','Cần xử lý ngay','var(--red)')}</div>
 <div class="grid-main"><div class="panel"><div class="panel-head"><div><h3>Hoạt động mượn thiết bị</h3><p>Biểu đồ minh họa số lượt mượn trong 6 tháng</p></div><span class="status green">+12.8%</span></div><div class="chart">${[38,56,45,72,61,88].map((v,i)=>`<div class="bar-group"><div class="bar" style="height:${v}%"></div><div class="bar alt" style="height:${Math.max(10,v-22)}%"></div><span class="bar-label">${['T5','T6','T7','T8','T9','T10'][i]}</span></div>`).join('')}</div><div class="chart-legend"><span><i class="legend-dot"></i>Lượt mượn</span><span><i class="legend-dot blue"></i>Lượt trả</span></div></div>
 <div class="panel"><div class="panel-head"><div><h3>Hoạt động gần đây</h3><p>Cập nhật trong hệ thống</p></div><span style="color:var(--green)">•••</span></div><div class="activity"><div class="activity-item"><div class="activity-icon">＋</div><div><strong>Tạo phiếu mượn mới</strong><p>Nguyễn Minh Anh · 2 Laptop Dell</p><time>Hôm nay, 09:15</time></div></div><div class="activity-item"><div class="activity-icon">↩</div><div><strong>Thiết bị được hoàn trả</strong><p>Lê Thảo Vy · Bộ Arduino Uno</p><time>Hôm qua, 15:40</time></div></div><div class="activity-item"><div class="activity-icon">!</div><div><strong>Phiếu mượn sắp quá hạn</strong><p>Trần Hoàng Nam · Máy chiếu Epson</p><time>Hôm qua, 08:30</time></div></div></div></div></div>
 <div class="lower-grid"><div class="panel"><div class="panel-head"><div><h3>Phiếu mượn gần đây</h3><p>Danh sách giao dịch mới nhất</p></div><button class="text-link" onclick="go('loans')">Xem tất cả →</button></div>${loanTable(data.loans.slice(0,4))}</div><div class="panel"><div class="panel-head"><div><h3>Thao tác nhanh</h3><p>Truy cập chức năng thường dùng</p></div></div><div class="quick-grid"><button class="quick" onclick="go('devices')"><span>▣</span><b>Quản lý thiết bị</b><small>Thêm và cập nhật kho</small></button><button class="quick" onclick="go('borrowers')"><span>♙</span><b>Người mượn</b><small>Thông tin cá nhân</small></button><button class="quick" onclick="openModal('loan')"><span>⇄</span><b>Tạo phiếu mượn</b><small>Ghi nhận giao dịch</small></button><button class="quick" onclick="go('returns')"><span>↩</span><b>Theo dõi trả</b><small>Kiểm tra hạn trả</small></button></div></div></div>`;
}
function loanTable(rows){if(!rows.length)return '<div class="empty"><div>▤</div>Chưa có phiếu mượn</div>';return `<div class="table-wrap"><table><thead><tr><th>MÃ PHIẾU</th><th>NGƯỜI MƯỢN</th><th>THIẾT BỊ</th><th>HẠN TRẢ</th><th>TRẠNG THÁI</th></tr></thead><tbody>${rows.map(l=>`<tr><td>#${l.id}</td><td>${l.borrower}</td><td>${l.device} × ${l.qty}</td><td>${l.dueDate}</td><td><span class="status ${statusClass(l.status)}">${l.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function devicesPage(){return head('ASSET MANAGEMENT / 02','Quản lý thiết bị','Quản lý danh mục, số lượng và tình trạng thiết bị.','<button class="btn btn-primary" onclick="openModal(\'device\')">＋ Thêm thiết bị</button>')+`<div class="panel"><div class="toolbar"><div class="search"><input id="searchBox" placeholder="Tìm tên hoặc loại thiết bị..." oninput="filterRows()"></div><select id="filterStatus" onchange="filterRows()"><option value="">Tất cả tình trạng</option><option>Sẵn sàng</option><option>Đang cho mượn</option><option>Bảo trì</option></select></div><div id="tableArea">${deviceTable(data.devices)}</div></div>`}
function deviceTable(rows){return `<div class="table-wrap"><table><thead><tr><th>THIẾT BỊ</th><th>MÃ ID</th><th>LOẠI</th><th>SỐ LƯỢNG</th><th>TÌNH TRẠNG</th><th>THAO TÁC</th></tr></thead><tbody>${rows.map(d=>`<tr><td><div class="device-cell"><div class="device-pic">${d.icon||'▣'}</div><div><b>${d.name}</b><small>Kho thiết bị GearFlow</small></div></div></td><td>TB-${String(d.id).padStart(3,'0')}</td><td>${d.type}</td><td>${d.qty}</td><td><span class="status ${statusClass(d.status)}">${d.status}</span></td><td><button class="action-btn" onclick="editItem('device',${d.id})">Sửa</button><button class="action-btn" onclick="deleteItem('device',${d.id})">Xóa</button></td></tr>`).join('')}</tbody></table></div>`}
function borrowersPage(){return head('PEOPLE / 03','Quản lý người mượn','Lưu trữ thông tin cá nhân và đơn vị công tác.','<button class="btn btn-primary" onclick="openModal(\'borrower\')">＋ Thêm người mượn</button>')+`<div class="panel"><div class="toolbar"><div class="search"><input id="searchBox" placeholder="Tìm họ tên, đơn vị, số điện thoại..." oninput="filterRows()"></div></div><div id="tableArea">${borrowerTable(data.borrowers)}</div></div>`}
function borrowerTable(rows){return `<div class="table-wrap"><table><thead><tr><th>NGƯỜI MƯỢN</th><th>MÃ ID</th><th>ĐƠN VỊ</th><th>SỐ ĐIỆN THOẠI</th><th>THAO TÁC</th></tr></thead><tbody>${rows.map(b=>`<tr><td><div class="device-cell"><div class="avatar">${b.name.split(' ').slice(-2).map(x=>x[0]).join('')}</div><b>${b.name}</b></div></td><td>NM-${String(b.id).padStart(3,'0')}</td><td>${b.unit}</td><td>${b.phone}</td><td><button class="action-btn" onclick="editItem('borrower',${b.id})">Sửa</button><button class="action-btn" onclick="deleteItem('borrower',${b.id})">Xóa</button></td></tr>`).join('')}</tbody></table></div>`}
function loansPage(){return head('BORROWING / 04','Quản lý phiếu mượn','Tạo phiếu, ghi nhận thiết bị và thời gian mượn – trả.','<button class="btn btn-primary" onclick="openModal(\'loan\')">＋ Tạo phiếu mượn</button>')+`<div class="panel"><div class="toolbar"><div class="search"><input id="searchBox" placeholder="Tìm mã phiếu hoặc người mượn..." oninput="filterRows()"></div><select id="filterStatus" onchange="filterRows()"><option value="">Tất cả trạng thái</option><option>Đang mượn</option><option>Quá hạn</option><option>Đã trả</option></select></div><div id="tableArea">${fullLoanTable(data.loans)}</div></div>`}
function fullLoanTable(rows){return `<div class="table-wrap"><table><thead><tr><th>MÃ PHIẾU</th><th>NGƯỜI MƯỢN</th><th>THIẾT BỊ</th><th>SL</th><th>NGÀY MƯỢN</th><th>HẸN TRẢ</th><th>TRẠNG THÁI</th><th>THAO TÁC</th></tr></thead><tbody>${rows.map(l=>`<tr><td>#${l.id}</td><td>${l.borrower}</td><td>${l.device}</td><td>${l.qty}</td><td>${l.borrowDate}</td><td>${l.dueDate}</td><td><span class="status ${statusClass(l.status)}">${l.status}</span></td><td>${l.status!=='Đã trả'?`<button class="action-btn" onclick="markReturned(${l.id})">Xác nhận trả</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
function returnsPage(){const active=data.loans.filter(l=>l.status!=='Đã trả');return head('RETURN TRACKING / 05','Theo dõi trả thiết bị','Kiểm tra hạn trả, xác nhận hoàn trả và ghi nhận tình trạng.','')+`<div class="stats">${stat('Chờ hoàn trả',active.length,'↩','Phiếu chưa hoàn tất')}${stat('Quá hạn',active.filter(l=>l.status==='Quá hạn').length,'◷','Cần liên hệ người mượn','var(--red)')}${stat('Đã hoàn tất',data.loans.filter(l=>l.status==='Đã trả').length,'✓','Đã xác nhận trả')}${stat('Đang mượn',active.filter(l=>l.status==='Đang mượn').length,'⇄','Trong thời hạn','var(--blue)')}</div><div class="panel"><div class="panel-head"><div><h3>Danh sách cần theo dõi</h3><p>Xác nhận trả sau khi kiểm tra thiết bị thực tế</p></div></div>${fullLoanTable(active)}</div>`}
function render(){const names={dashboard:'Dashboard',devices:'Thiết bị',borrowers:'Người mượn',loans:'Phiếu mượn',returns:'Theo dõi trả'};$('#crumb').textContent=names[currentPage];$('#page').innerHTML=({dashboard,devices:devicesPage,borrowers:borrowersPage,loans:loansPage,returns:returnsPage}[currentPage])();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function go(p){currentPage=p;render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function filterRows(){const q=($('#searchBox')?.value||'').toLowerCase(),s=$('#filterStatus')?.value||'';if(currentPage==='devices')$('#tableArea').innerHTML=deviceTable(data.devices.filter(x=>(x.name+x.type).toLowerCase().includes(q)&&(!s||x.status===s)));if(currentPage==='borrowers')$('#tableArea').innerHTML=borrowerTable(data.borrowers.filter(x=>(x.name+x.unit+x.phone).toLowerCase().includes(q)));if(currentPage==='loans')$('#tableArea').innerHTML=fullLoanTable(data.loans.filter(x=>(String(x.id)+x.borrower+x.device).toLowerCase().includes(q)&&(!s||x.status===s)))}
const schemas={
 device:[['name','Tên thiết bị','text'],['type','Loại thiết bị','text'],['qty','Số lượng','number'],['status','Tình trạng','select',['Sẵn sàng','Đang cho mượn','Bảo trì']],['icon','Biểu tượng (emoji)','text']],
 borrower:[['name','Họ và tên','text'],['unit','Đơn vị','text'],['phone','Số điện thoại','tel']],
 loan:[['borrower','Người mượn','selectBorrower'],['device','Thiết bị','selectDevice'],['qty','Số lượng mượn','number'],['borrowDate','Ngày mượn','date'],['dueDate','Ngày hẹn trả','date']]
};
function openModal(type,item=null){modalType=type;editing=item;const labels={device:'Thiết bị',borrower:'Người mượn',loan:'Phiếu mượn'};$('#modalTitle').textContent=(item?'Cập nhật ':'Thêm ')+labels[type];$('#modalFields').innerHTML=schemas[type].map(f=>{let [key,label,kind,opts]=f,val=item?.[key]??(key==='qty'?1:'');let control=kind==='select'?`<select name="${key}">${opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`:kind==='selectBorrower'?`<select name="${key}">${data.borrowers.map(b=>`<option ${b.name===val?'selected':''}>${b.name}</option>`).join('')}</select>`:kind==='selectDevice'?`<select name="${key}">${data.devices.map(d=>`<option ${d.name===val?'selected':''}>${d.name}</option>`).join('')}</select>`:`<input name="${key}" type="${kind}" value="${val}" ${key==='qty'?'min="1"':''} required>`;return `<div class="form-group ${key==='unit'?'full':''}"><label>${label}</label>${control}</div>`}).join('');$('#modalBackdrop').classList.add('show')}
function closeModal(){$('#modalBackdrop').classList.remove('show')}
$('#modalForm').addEventListener('submit',e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());if(modalType==='device'||modalType==='loan')obj.qty=Number(obj.qty);if(editing){const arr=modalType==='device'?data.devices:modalType==='borrower'?data.borrowers:data.loans;Object.assign(arr.find(x=>x.id===editing.id),obj)}else if(modalType==='loan'){obj.id=Math.max(1000,...data.loans.map(x=>x.id))+1;obj.returnDate='';obj.status='Đang mượn';data.loans.unshift(obj)}else{const arr=modalType==='device'?data.devices:data.borrowers;obj.id=Math.max(0,...arr.map(x=>x.id))+1;data[modalType==='device'?'devices':'borrowers'].unshift(obj)}save();closeModal();render();toast('Đã lưu thông tin thành công')});
function editItem(type,id){const arr=type==='device'?data.devices:data.borrowers;openModal(type,arr.find(x=>x.id===id))}
function deleteItem(type,id){if(!confirm('Bạn có chắc muốn xóa mục này?'))return;const key=type==='device'?'devices':'borrowers';data[key]=data[key].filter(x=>x.id!==id);save();render();toast('Đã xóa dữ liệu')}
function markReturned(id){const l=data.loans.find(x=>x.id===id);if(!l)return;l.status='Đã trả';l.returnDate=new Date().toISOString().slice(0,10);save();render();toast('Đã xác nhận hoàn trả thiết bị')}
$('#today').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());
render();
</script>
</body>
</html>
